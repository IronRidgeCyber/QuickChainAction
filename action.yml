name: QuickChain Scan
description: Start a QuickChain supply-chain scan from GitHub Actions.
author: IronRidgeCyber

inputs:
  api-key:
    description: QuickChain CI token generated from the QuickChain web app.
    required: true
  api-url:
    description: QuickChain web app URL.
    required: false
    default: https://ironridgecyber.com
  project-id:
    description: QuickChain project ID. If omitted, QuickChain tries to match the GitHub repository.
    required: false
  fail-on:
    description: Severity threshold that fails the workflow. Use none, any, low, medium, high, or critical.
    required: false
    default: critical
  fail-on-reachable-only:
    description: When true, fail-on only evaluates vulnerabilities with potential runtime reachability.
    required: false
    default: "false"
  wait:
    description: Wait for the QuickChain scan to finish before completing the step.
    required: false
    default: "true"
  write-artifacts:
    description: Write SBOM, VEX, and remediation PDF files to the output directory when the scan completes.
    required: false
    default: "true"
  output-directory:
    description: Directory where QuickChain result files are written. Existing contents are replaced.
    required: false
    default: QuickChainResults
  timeout-minutes:
    description: Maximum time to wait for a scan.
    required: false
    default: "35"
  poll-interval-seconds:
    description: Seconds between status checks while waiting.
    required: false
    default: "15"

outputs:
  scan-id:
    description: QuickChain scan ID.
  dashboard-url:
    description: QuickChain dashboard URL for this scan.
  status:
    description: Final or accepted scan status.
  critical-count:
    description: Critical vulnerability count.
  high-count:
    description: High vulnerability count.
  medium-count:
    description: Medium vulnerability count.
  low-count:
    description: Low vulnerability count.
  total-count:
    description: Total vulnerability count.
  critical-reachable-count:
    description: Critical vulnerabilities with potential runtime reachability.
  high-reachable-count:
    description: High vulnerabilities with potential runtime reachability.
  medium-reachable-count:
    description: Medium vulnerabilities with potential runtime reachability.
  low-reachable-count:
    description: Low vulnerabilities with potential runtime reachability.
  reachable-count:
    description: Total vulnerabilities with potential runtime reachability.
  sbom-available:
    description: Whether QuickChain produced an SBOM artifact for this scan.
  vex-available:
    description: Whether QuickChain produced a VEX artifact for this scan.
  results-directory:
    description: Directory containing QuickChain result files.

runs:
  using: node24
  main: dist/index.js

branding:
  icon: shield
  color: green
